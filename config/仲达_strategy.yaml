# 仲达策略配置 — Serenity 紫苏叶五因子模型 + SEPA 趋势模板
# 
# Serenity 紫苏叶五因子模型（原创方法论）：
# ① 确定需求  — AI/新能源/国产替代确定性链条？下游CapEx增长？
# ② 受限供给  — 全球供给瓶颈？产业链壁垒？
# ③ 低关注度  — 券商覆盖数、研报数量（价值洼地）
# ④ 价值捕获  — 毛利率、客户锁定性、定价权
# ⑤ 催化剂    — 未来1-3月关键事件（财报/量产/政策）

strategy:
  name: "仲达"
  type: "fundamental_weekly"
  description: "Serenity 紫苏叶五因子模型 + SEPA 趋势模板 + VCP形态，全仓中线持有"

time:
  full_scan: "周日 21:00"
  incremental_check: "08:30"
  buy_time: "09:30"
  review_time: "15:00"
  weekly_output: "周日 22:00"

screening:
  factors:
    确定需求:
      weight: 25
      description: "AI/新能源/国产替代确定性链条？下游CapEx增长？"
    受限供给:
      weight: 25
      description: "全球供给瓶颈？产业链壁垒？"
    低关注度:
      weight: 15
      description: "券商覆盖数、研报数量（价值洼地挖掘）"
    价值捕获:
      weight: 20
      description: "毛利率、客户锁定性、定价权"
    催化剂:
      weight: 15
      description: "未来1-3月关键事件（财报/量产/政策）"
  入池门槛: 70
  sepa:
    enabled: true
    均线周期_短期: 50
    均线周期_中期: 150
    均线周期_长期: 200
    RS评级门槛: 80
    52周高点门槛_pct: 75

risk:
  止损_pct: -5.0
  止盈_pct: 15.0
  持仓上限: 1          # 全仓1只
  单只仓位上限_pct: 100 # 全仓

capital:
  initial: 2000         # 初始资金2000元
